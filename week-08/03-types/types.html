<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types in JavaScript</title>
    <style>
      table {
        border-collapse: collapse;
        font-family: Consolas, monospace;
      }

      th,
      td {
        border: 1px solid gray;
        padding: 4px 12px;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <h1>Types in JavaScript</h1>
    <table>
      <thead>
        <tr>
          <th scope="col">What</th>
          <th scope="col">Result</th>
          <th scope="col">Type</th>
        </tr>
      </thead>
      <tbody id="result-rows"></tbody>
    </table>
    <script>
      // Adds one row to the results table.
      const resultRows = document.getElementById('result-rows');

      function show(label, result) {
        const row = document.createElement('tr');
        for (const text of [label, result, typeof result]) {
          const cell = document.createElement('td');
          cell.textContent = text;
          row.append(cell);
        }
        resultRows.append(row);
      }

      // Three values, three types
      const loaves = 12;
      const loafName = 'Sourdough';
      const inStock = true;
      show('loaves', loaves);
      show('loaf name', loafName);
      show('in stock', inStock);

      // One variable, two types
      let stock = 12;
      show('stock', stock);
      stock = 'twelve';
      show('stock, changed', stock);

      // Plus with numbers and strings
      show('number plus number', 5 + 10);
      show('string plus string', 'Sour' + 'dough');
      show('number plus string', 5 + '10');

      // Times and minus turn strings into numbers
      show('number times string', 5 * '10');
      show('number minus letters', 5 - 'abc');

      // Converting on purpose
      show('number plus converted string', 5 + Number('10'));
    </script>
  </body>
</html>
