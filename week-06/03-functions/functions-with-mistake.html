<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
  </head>
  <body>
    <h1>Functions</h1>
    <button onclick="sayHello()">Say hello</button>
    <script>
      function sayHello() {
        document.write("Hello from a function");
      }
    </script>
  </body>
</html>
