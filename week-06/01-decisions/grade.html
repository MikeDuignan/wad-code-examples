<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade</title>
  </head>
  <body>
    <script>
      // Write a message that depends on the score
      var score = 120;
      if (score < 0 || score > 100) {
        document.write("That is not a valid score");
      } else if (score >= 70) {
        document.write("Well done");
      } else if (score >= 40) {
        document.write("You passed");
      } else {
        document.write("Try again");
      }
    </script>
  </body>
</html>
