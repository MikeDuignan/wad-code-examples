<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam score</title>
  </head>
  <body>
    <script>
      // Ask for an exam score, then say whether it is a pass
      var score = Number(prompt("Please enter your exam score"));
      if (score > 40) {
        document.write("You passed");
      } else {
        document.write("Try again");
      }
    </script>
  </body>
</html>
