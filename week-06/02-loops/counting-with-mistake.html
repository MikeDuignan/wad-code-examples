<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting</title>
  </head>
  <body>
    <script>
      // Count up from one and write each number
      for (var i = 1; i <= 3; i++) {
        document.write(i);
      }
    </script>
  </body>
</html>
