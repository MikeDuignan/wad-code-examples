<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of a rectangle</title>
  </head>
  <body>
    <script>
      // The area of a rectangle: width times height
      function getArea(width, height) {
        return width * height;
      }
      var wallWidth = 10;
      var wallHeight = 6;
      alert(getArea(wallWidth, wallHeight));
    </script>
  </body>
</html>
