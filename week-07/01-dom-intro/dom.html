<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tern Point Lighthouse</title>
  </head>
  <body>
    <h1>Tern Point Lighthouse</h1>
    <p id="opening-times">Open to visitors daily from ten until four.</p>
    <ul>
      <li>Wear sturdy shoes for the stairs.</li>
      <li>Tours start at the cottage by the gate.</li>
      <li>Dogs are welcome outside.</li>
    </ul>
    <script>
      const openingTimes = document.getElementById('opening-times');
      openingTimes.textContent = 'Summer hours, open daily from ten until six.';
      const firstNote = document.querySelector('ul li');
      firstNote.textContent = 'Wear sturdy shoes and bring a torch.';
    </script>
  </body>
</html>
