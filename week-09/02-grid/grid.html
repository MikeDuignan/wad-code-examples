<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Corner Bakehouse</title>
    <link
      href=
      "https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity=
      "sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous">
    <style>
      .demo-tile {
        background-color: #f6d8a8;
      }
    </style>
  </head>
  <body>
    <header class="container py-3">
      <h1>Corner Bakehouse</h1>
      <p>Fresh bakes for collection</p>
    </header>
    <main class="container">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col">
          <article>
            <img src="images/scones.jpg" class="img-fluid"
              alt="Two golden scones on a plate"
              width="600" height="360">
            <h2>Scones</h2>
          </article>
        </div>
        <div class="col">
          <article>
            <img src="images/sourdough.jpg" class="img-fluid"
              alt="A round sourdough loaf with a scored crust"
              width="600" height="360">
            <h2>Sourdough</h2>
          </article>
        </div>
        <div class="col">
          <article>
            <img src="images/brownies.jpg" class="img-fluid"
              alt="Three chocolate brownie squares"
              width="600" height="360">
            <h2>Brownies</h2>
          </article>
        </div>
        <div class="col">
          <article>
            <img src="images/croissants.jpg" class="img-fluid"
              alt="A curved golden croissant"
              width="600" height="360">
            <h2>Croissants</h2>
          </article>
        </div>
        <div class="col">
          <article>
            <img src="images/flapjacks.jpg" class="img-fluid"
              alt="Three oat flapjack squares"
              width="600" height="360">
            <h2>Flapjacks</h2>
          </article>
        </div>
        <div class="col">
          <article>
            <img src="images/raisin-scones.jpg" class="img-fluid"
              alt="Two scones dotted with raisins"
              width="600" height="360">
            <h2>Raisin scones</h2>
          </article>
        </div>
      </div>
    </main>
    <footer class="container py-3">
      <p>Collect from the bakery, Tuesday to Saturday.</p>
    </footer>
    <script
      src=
      "https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity=
      "sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"></script>
  </body>
</html>
