<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corner Bakehouse</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="display-4 text-center">Corner Bakehouse</h1>
        <p class="lead">Fresh bread and small bakes, made here each morning.</p>
      </header>
      <main class="mt-3 p-4">
        <h2 class="fw-bold">Baked today</h2>
        <ul>
          <li>Scones</li>
          <li>Sourdough</li>
          <li>Brownies</li>
        </ul>
        <img src="images/bakes.svg"
          alt="Scones, a sourdough loaf and brownies on a tray"
          width="480" height="160" class="img-fluid d-block mx-auto">
        <a class="btn btn-primary mt-3" href="#visit">Visiting the bakery</a>
      </main>
      <footer id="visit" class="px-4">
        <p class="m-0">Open Tuesday to Saturday, eight until four.</p>
      </footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"></script>
  </body>
</html>
